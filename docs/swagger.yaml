basePath: /api/v1
definitions:
  models.UrlDto:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      short_code:
        type: string
      short_url:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  models.UrlInput:
    properties:
      url:
        type: string
    type: object
  models.UserCreateDto:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  models.UserDto:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      verified:
        type: boolean
    type: object
  models.UserLoginDto:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.UserLoginResponseDto:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      token:
        type: string
    type: object
  models.UserUpdateDto:
    properties:
      current_password:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
host: localhost:8086
info:
  contact:
    email: prateeksharma.2801@gmail.com
    name: Prateek Sharma
  description: This is a simple URL shortener admin API.
  termsOfService: http://swagger.io/terms/
  title: URL Shortener API
  version: "1.0"
paths:
  /urls:
    get:
      description: List the user's short URLs, newest first, a page at a time. When
        more results exist the X-Next-Cursor response header holds the cursor for
        the next page; it is absent on the last page.
      parameters:
      - default: 50
        description: Page size, 1-100
        in: query
        name: limit
        type: integer
      - description: Value of X-Next-Cursor from the previous page
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Next-Cursor:
              description: Cursor for the next page
              type: string
          schema:
            items:
              $ref: '#/definitions/models.UrlDto'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List URLs
      tags:
      - URLs
    post:
      consumes:
      - application/json
      description: Create a short URL for a given long URL
      parameters:
      - description: URL Input
        in: body
        name: urlInput
        required: true
        schema:
          $ref: '#/definitions/models.UrlInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UrlDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create a short URL
      tags:
      - URLs
  /urls/{id}:
    delete:
      description: Delete a short URL by ID
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete a URL
      tags:
      - URLs
    get:
      description: Get details of a specific short URL by ID
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UrlDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get URL details
      tags:
      - URLs
    put:
      consumes:
      - application/json
      description: Update the long URL for a given short URL ID
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      - description: URL Input
        in: body
        name: urlInput
        required: true
        schema:
          $ref: '#/definitions/models.UrlInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UrlDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update a URL
      tags:
      - URLs
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password and return a JWT token. Email
        matching is case-insensitive.
      parameters:
      - description: Login details
        in: body
        name: loginDto
        required: true
        schema:
          $ref: '#/definitions/models.UserLoginDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserLoginResponseDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Login a user
      tags:
      - Users
  /users/me:
    get:
      description: Retrieve information about the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserDto'
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user info
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's information
      parameters:
      - description: User update details. current_password is required when changing
          password
        in: body
        name: updateDto
        required: true
        schema:
          $ref: '#/definitions/models.UserUpdateDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserDto'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user info
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create an account. The email is the login ID; it is stored lowercase
        and must be unique (case-insensitive). Returns 409 when the email is already
        registered. Limited to 5 registrations per IP per hour. Available only when
        REGISTRATION_ENABLED is true.
      parameters:
      - description: Registration details
        in: body
        name: createDto
        required: true
        schema:
          $ref: '#/definitions/models.UserCreateDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.UserDto'
        "400":
          description: Invalid body, or per-field errors under \"fields\
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Users
swagger: "2.0"
