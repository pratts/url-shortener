basePath: /api/v1
definitions:
  shortlink.Input:
    properties:
      url:
        type: string
    type: object
  shortlink.Page:
    properties:
      items:
        items:
          $ref: '#/definitions/shortlink.View'
        type: array
      next_cursor:
        type: string
    type: object
  shortlink.View:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      short_code:
        type: string
      short_url:
        type: string
      updated_at:
        type: string
      url:
        type: string
    type: object
  user.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user.Profile:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      verified:
        type: boolean
    type: object
  user.RegisterInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  user.Session:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      token:
        type: string
      verified:
        type: boolean
    type: object
  user.UpdateInput:
    properties:
      current_password:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
info:
  contact:
    email: prateeksharma.2801@gmail.com
    name: Prateek Sharma
  description: Admin API for creating and managing short URLs.
  title: URL Shortener API
  version: "1.0"
paths:
  /urls:
    get:
      description: List the user's short URLs, newest first, a page at a time. Pass
        next_cursor from the previous page as cursor to get the next one; next_cursor
        is null on the last page.
      parameters:
      - default: 50
        description: Page size, 1-100
        in: query
        name: limit
        type: integer
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shortlink.Page'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List URLs
      tags:
      - URLs
    post:
      consumes:
      - application/json
      parameters:
      - description: Target URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/shortlink.Input'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/shortlink.View'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a short URL
      tags:
      - URLs
  /urls/{id}:
    delete:
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a URL
      tags:
      - URLs
    get:
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shortlink.View'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a URL
      tags:
      - URLs
    put:
      consumes:
      - application/json
      parameters:
      - description: URL ID
        in: path
        name: id
        required: true
        type: integer
      - description: New target URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/shortlink.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/shortlink.View'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a URL's target
      tags:
      - URLs
  /users/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password and return a JWT token. Email
        matching is case-insensitive.
      parameters:
      - description: Login details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Session'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      summary: Log in
      tags:
      - Users
  /users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Profile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Change the name and/or password. current_password is required when
        changing the password.
      parameters:
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Profile'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update the current user
      tags:
      - Users
  /users/register:
    post:
      consumes:
      - application/json
      description: Create an account. The email is the login ID; it is stored lowercase
        and must be unique (case-insensitive). Returns 409 when the email is already
        registered. Limited to 5 registrations per IP per hour. Available only when
        REGISTRATION_ENABLED is true.
      parameters:
      - description: Registration details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.Profile'
        "400":
          description: Invalid body, or per-field errors under \"fields\
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Register
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: '"Bearer <token>" from POST /users/login'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
