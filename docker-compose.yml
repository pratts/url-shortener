# Local stack mirroring production: Postgres and Redis sit on an internal
# network with no published ports; only the admin API and the redirect
# service are reachable from the host. Settings come from .env (copy
# .env.example); hosts are overridden below to reach the containers.
x-app: &app
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  networks: [backend, public]
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4
    # Every key the app writes has a TTL, so volatile-lru can evict any of them
    # under memory pressure without touching keys that must persist.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies database migrations and exits; the services wait for it.
  migrate:
    <<: *app
    build: { context: ., target: admin }
    entrypoint: ["/app/migrate"]
    networks: [backend]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    <<: *app
    build: { context: ., target: admin }
    ports:
      - "8086:8086"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redirect:
    <<: *app
    build: { context: ., target: redirect }
    ports:
      - "8085:8085"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

networks:
  # No route in or out: only containers on this network can reach the datastores.
  backend:
    internal: true
  public: {}

volumes:
  pg_data:
